name: Postar notícia no Instagram (almoço e noite)

on:
  schedule:
    # 12:50 e 19:50 no horário de Brasília (UTC-3) = 15:50 e 22:50 UTC
    - cron: "50 15,22 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "testar = só confere | postar = respeita o horário | forcar = publica o próximo aprovado agora"
        required: true
        default: "testar"
        type: choice
        options: [testar, postar, forcar]
      post_id:
        description: "ID opcional (ex.: N14)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: postar-instagram
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar a notícia aprovada do horário
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MODO: ${{ github.event.inputs.modo || 'postar' }}
          POST_ID: ${{ github.event.inputs.post_id || '' }}
        run: python postar.py
      - name: Salvar comprovante na fila.json
        if: always()
        run: |
          git config user.name "robo-diretonaquestao"
          git config user.email "robo-diretonaquestao@users.noreply.github.com"
          git add fila.json
          git diff --cached --quiet || (git commit -m "Robô: notícia publicada" && git push)
