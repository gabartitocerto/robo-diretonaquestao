name: Postar no Instagram (confere a fila a cada 15 minutos)

on:
  schedule:
    # Confere a fila a cada 15 minutos, das 06:07 às 23:52 de Brasília (UTC-3).
    # O robô só publica quando chega a data/hora marcada no post (fila.json),
    # então o horário de cada post é quem manda, não este relógio.
    - cron: "7,22,37,52 9-23 * * *"
    - cron: "7,22,37,52 0-2 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "testar = só confere | postar = respeita o horário | forcar = publica o próximo aprovado agora"
        required: true
        default: "testar"
        type: choice
        options: [testar, postar, forcar]
      post_id:
        description: "ID opcional (ex.: N14)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: postar-instagram
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar a notícia aprovada do horário
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MODO: ${{ github.event.inputs.modo || 'postar' }}
          POST_ID: ${{ github.event.inputs.post_id || '' }}
        run: python postar.py
      - name: Salvar comprovante na fila.json
        if: always()
        run: |
          git config user.name "robo-diretonaquestao"
          git config user.email "robo-diretonaquestao@users.noreply.github.com"
          git add fila.json
          git diff --cached --quiet || (git commit -m "Robô: fila atualizada" && git push)
